name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build RobotArm.sln --configuration Release

      - name: Test
        run: dotnet test RobotArm.sln --configuration Release --no-build --filter "Category!=Report"

      - name: Publish RobotArm.Web (Release AOT)
        run: dotnet publish src/RobotArm.Web --configuration Release -o publish

      - name: Prepare GitHub Pages artifact (base href, .nojekyll, 404.html)
        run: |
          sed -i 's|<base href="/" />|<base href="/robot-kol-sanal-lab/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
