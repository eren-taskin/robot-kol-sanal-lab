name: CI

on:
  push:
  pull_request:

jobs:
  # Old core and its tests. The old core stays in the repository as the oracle for lab/verification.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build RobotArm.sln --configuration Release

      - name: Test
        run: dotnet test RobotArm.sln --configuration Release --no-build --filter "Category!=Report"

  # W4: both lab solutions on Linux. lab/RobotArmLab.sln is what the instructor opens (core, Forms, tests);
  # the Forms project compiles here through EnableWindowsTargeting. lab/verification/RobotArmLab.Verification.sln
  # compares the lab core with the old core (oracle tests).
  lab-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build lab solution
        run: dotnet build lab/RobotArmLab.sln --configuration Release

      - name: Test lab solution
        run: dotnet test lab/RobotArmLab.sln --configuration Release --no-build

      - name: Build verification solution
        run: dotnet build lab/verification/RobotArmLab.Verification.sln --configuration Release

      - name: Test verification solution (oracle)
        run: dotnet test lab/verification/RobotArmLab.Verification.sln --configuration Release --no-build

  # W2: the lab solution, including the Windows Forms application, on Windows.
  lab-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build lab solution (with Forms)
        run: dotnet build lab/RobotArmLab.sln --configuration Release

      - name: Test lab
        run: dotnet test lab/RobotArmLab.sln --configuration Release --no-build
